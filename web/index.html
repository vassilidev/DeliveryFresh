<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeliveryFresh</title>
<style>
:root { --g: #91c11e; --gd: #4d7a00; --bg: #f6f7f2; --card: #fff; --tx: #1f2a1f; --mu: #6b756b; --bd: #e3e8d8; --red: #c73b3b }
@media (prefers-color-scheme: dark) { :root { --bg: #151a14; --card: #1f261d; --tx: #eef2e8; --mu: #a3ad9f; --bd: #333d30; --gd: #b4e04a } }
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--tx); font: 15px/1.5 -apple-system, "Helvetica Neue", Arial, sans-serif }
a { color: var(--gd) }
.top { background: var(--g); color: #fff }
.top .in { max-width: 1000px; margin: 0 auto; padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center }
.logo { font-weight: 800; font-size: 20px; margin-right: auto; color: #fff; text-decoration: none }
nav { display: flex; flex-wrap: wrap; gap: 2px }
nav a { color: #fff; text-decoration: none; font-weight: 600; padding: 6px 10px; border-radius: 8px; white-space: nowrap }
nav a.on { background: rgba(255,255,255,.25) }
main { max-width: 1000px; margin: 0 auto; padding: 22px 16px 60px }
h1 { font-size: 24px; margin: 0 0 14px } h2 { font-size: 18px; margin: 22px 0 10px }
.card { background: var(--card); border: 1px solid var(--bd); border-radius: 14px; padding: 16px; margin-bottom: 14px }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)) }
.muted { color: var(--mu) } .small { font-size: 13px }
label { display: block; font-weight: 600; margin: 12px 0 4px }
input[type=text], input[type=number], textarea, select { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--bd); background: var(--bg); color: var(--tx); font: inherit }
textarea { min-height: 70px; resize: vertical }
.checks { display: flex; flex-wrap: wrap; gap: 8px } .checks label { display: inline-flex; gap: 6px; align-items: center; font-weight: 400; margin: 0; padding: 6px 10px; border: 1px solid var(--bd); border-radius: 99px; background: var(--bg); cursor: pointer }
.btn { display: inline-block; padding: 10px 16px; border-radius: 10px; border: 0; background: var(--g); color: #fff; font: inherit; font-weight: 700; cursor: pointer; text-decoration: none }
.btn.ghost { background: transparent; color: var(--tx); border: 1px solid var(--bd) } .btn:disabled { opacity: .5; cursor: default }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center }
.badge { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 99px; background: var(--bg); border: 1px solid var(--bd) }
.badge.ok { background: var(--g); border-color: var(--g); color: #fff }
.log { background: #111; color: #cfe8a0; border-radius: 10px; padding: 10px; font: 12px/1.5 ui-monospace, Menlo, monospace; max-height: 320px; overflow: auto; white-space: pre-wrap; word-break: break-word }
.slots { overflow-x: auto } .slots table { border-collapse: collapse } .slots td, .slots th { padding: 4px 8px; text-align: center; white-space: nowrap } .slots th { font-size: 13px; font-weight: 600 }
table.cmp { width: 100%; border-collapse: collapse } .cmp td, .cmp th { padding: 10px 8px; border-bottom: 1px solid var(--bd); text-align: left; vertical-align: top } .cmp .num { text-align: right; white-space: nowrap }
.cmp tr.reco { background: color-mix(in srgb, var(--g) 12%, transparent) }
.table-wrap { overflow-x: auto }
.stars button { background: none; border: 0; font-size: 22px; cursor: pointer; color: var(--bd); padding: 0 2px } .stars button.on { color: #f5a623 }
.err { color: var(--red); font-weight: 600 }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--bd); border-top-color: var(--g); border-radius: 50%; animation: s 1s linear infinite; vertical-align: -2px } @keyframes s { to { transform: rotate(360deg) } }
</style>
</head>
<body>
<header class="top"><div class="in">
  <a class="logo" href="#/">🥕 DeliveryFresh</a>
  <nav>
    <a href="#/">Commandes</a><a href="#/new">Nouvelle commande</a><a href="#/plats">Mes plats</a><a href="#/profil">Profil</a><a href="#/comptes">Comptes</a>
  </nav>
</div></header>
<main id="app"></main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const eur = n => n == null ? '—' : n.toFixed(2).replace('.', ',') + ' €';
// Prix PAYÉ par repas (comparable entre paniers) ; le coût consommé par repas (perMeal, calcul de l'IA) est affiché sur la commande.
const perMeal = (b, nMeals) => nMeals ? b.total / nMeals : null;
async function api(path, opts = {}) {
  const r = await fetch('/api' + path, { ...opts, headers: { 'content-type': 'application/json' }, body: opts.body && JSON.stringify(opts.body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
let timer;
function poll(fn, ms = 2500) { clearTimeout(timer); timer = setTimeout(fn, ms); }

const views = {
  // ---------- Commandes ----------
  async '/'() {
    const [orders, prof] = await Promise.all([api('/orders'), api('/profile')]);
    const intro = !prof.exists ? `<div class="card">👋 Bienvenue ! Commence par remplir ton <a href="#/profil">profil</a>, puis connecte tes <a href="#/comptes">comptes</a>.</div>` : '';
    return `${intro}<div class="row" style="justify-content:space-between"><h1>Commandes</h1><a class="btn" href="#/new">+ Nouvelle commande</a></div>
      ${orders.length ? orders.map(o => `<a class="card row" style="text-decoration:none;color:inherit;justify-content:space-between" href="#/o/${esc(o.id)}">
        <span><b>${esc(o.title)}</b><br><span class="muted small">${esc(o.id)}</span></span>
        <span class="badge ${o.state === 'Terminée' ? 'ok' : ''}">${o.busy ? '<span class="spin"></span> ' : ''}${esc(o.state)}</span></a>`).join('')
      : '<p class="muted">Aucune commande pour l\'instant.</p>'}`;
  },

  // ---------- Nouvelle commande ----------
  async '/new'() {
    const { profile, exists } = await api('/profile');
    if (!exists) return `<div class="card">Remplis d'abord ton <a href="#/profil">profil</a> (adresse, équipements…).</div>`;
    const days = [...Array(7)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() + i); return d; });
    const fmt = d => d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'short' });
    const hour = new Date().getHours();
    setTimeout(() => $('#f').onsubmit = async e => {
      e.preventDefault();
      const f = new FormData(e.target);
      try {
        const { id } = await api('/orders', { method: 'POST', body: {
          // ordre chronologique (le tableau se lit ligne par ligne : tous les midis puis tous les soirs)
          slots: [...e.target.querySelectorAll('input[name=slot]:checked')].sort((a, b) => a.dataset.k - b.dataset.k).map(x => x.value), people: f.get('people'), exceptions: f.get('exceptions'), extras: f.get('extras'),
          wishes: f.get('wishes'), budget: f.get('budget'), platforms: f.getAll('platform'),
        } });
        location.hash = '#/o/' + id;
      } catch (err) { $('#msg').textContent = err.message; }
    });
    return `<h1>Nouvelle commande</h1><form id="f" class="card">
      <label>Repas à couvrir</label>
      <div class="slots"><table><tr><th></th>${days.map(d => `<th>${esc(fmt(d))}</th>`).join('')}</tr>
        ${['midi', 'soir'].map(m => `<tr><th>${m}</th>${days.map((d, i) => {
          const past = i === 0 && (m === 'midi' ? hour >= 14 : hour >= 21);
          return `<td><input type="checkbox" name="slot" data-k="${i * 2 + (m === 'soir' ? 1 : 0)}" value="${esc(fmt(d) + ' ' + m)}" aria-label="${esc(fmt(d) + ' ' + m)}" ${past ? 'disabled' : ''}></td>`;
        }).join('')}</tr>`).join('')}</table></div>
      <div class="grid">
        <div><label for="people">Personnes par repas</label><input id="people" type="number" name="people" min="1" max="20" value="${esc(profile.people)}"></div>
        <div><label for="budget">Budget</label><select id="budget" name="budget">
          <option>équilibré</option><option>le moins cher possible</option><option>qualité d'abord</option></select></div>
      </div>
      <label for="exceptions">Exceptions pour cette fois <span class="muted small">(invité mardi soir, pas de micro-ondes…)</span></label>
      <textarea id="exceptions" name="exceptions"></textarea>
      <label for="extras">Courses perso en plus <span class="muted small">(café, lait, petit-déj, snacks…)</span></label>
      <textarea id="extras" name="extras"></textarea>
      <label for="wishes">Envies / contraintes <span class="muted small">(envie de pâtes, rien de trop long…)</span></label>
      <textarea id="wishes" name="wishes"></textarea>
      <label>Plateformes à comparer</label>
      <div class="checks"><label><input type="checkbox" name="platform" value="ubereats" checked> Uber Eats</label><label><input type="checkbox" name="platform" value="deliveroo" checked> Deliveroo</label></div>
      <p class="err" id="msg"></p>
      <button class="btn">Me proposer des menus</button>
      <p class="muted small">L'IA prépare 2 à 3 menus (1 à 3 min). Tu les choisiras sur la page suivante.</p>
    </form>`;
  },

  // ---------- Détail d'une commande ----------
  async '/o/:id'(id) {
    const o = await api('/orders/' + id);
    const busy = ['queued', 'running'].includes(o.job?.status);
    if (busy) poll(render);
    const req = o.request || {};
    const nMeals = o.choice?.chosen?.meals?.length || (req.slots || []).length;
    let step = '';
    if (busy) {
      step = `<div class="card"><h2 style="margin-top:0"><span class="spin"></span> ${esc(o.job.label)}${o.job.queued > 0 ? ` — en attente (${o.job.queued} avant)` : ''}</h2>
        <p class="muted small">Tu peux fermer cette page, ça continue en arrière-plan.</p>
        <div class="log" id="log">${esc(o.job.log.join('\n')) || 'Démarrage…'}</div></div>`;
      setTimeout(() => { const l = $('#log'); if (l) l.scrollTop = l.scrollHeight; });
    } else if (o.job?.status === 'error') {
      step = `<div class="card"><p class="err">La dernière étape a échoué.</p><div class="log">${esc(o.job.log.slice(-15).join('\n'))}</div>
        <p><button class="btn" onclick="retry('${esc(id)}')">Relancer</button></p></div>`;
    } else if (o.pick) {
      const b = o.result.baskets.find(x => x.id === o.pick.basketId) || {};
      const c = o.cart, app = b.platform === 'ubereats' ? 'Uber Eats' : 'Deliveroo';
      const status = !c ? '<p class="muted">Panier pas encore vérifié.</p>'
        : c.missing ? `<p class="err">⚠️ Ce panier n'existe plus sur ${app} (vérifié le ${esc(new Date(c.checkedAt).toLocaleString('fr-FR'))}) : déjà commandé, vidé ou expiré.</p>
          <p><button class="btn" onclick="rebuild('${esc(id)}')">♻️ Recréer le panier</button> <span class="muted small">À ne faire que si tu n'as pas encore commandé.</span></p>`
        : c.unavailable?.length
          ? `<p class="err">⚠️ ${c.unavailable.length} article(s) indisponible(s) : ${esc(c.unavailable.map(i => i.title).join(', '))}</p>`
          : `<p>✅ Panier vérifié le ${esc(new Date(c.checkedAt).toLocaleString('fr-FR'))} : ${c.items.length} articles, tout est disponible.</p>`;
      const r = o.repair;
      const repair = r ? `<div class="card small" style="background:var(--bg)"><b>🔁 Remplacements faits par l'IA</b><ul>
        ${(r.replaced || []).map(x => `<li>${esc(x.from)} → <b>${esc(x.to)}</b>${x.note ? ` <span class="muted">(${esc(x.note)})</span>` : ''}</li>`).join('')}
        ${(r.removed || []).map(x => `<li>${esc(x.from)} retiré${x.why ? ` <span class="muted">(${esc(x.why)})</span>` : ''}</li>`).join('')}
        ${(r.recipeChanges || []).map(x => `<li>📝 ${esc(x.when)} : ${esc(x.change)}</li>`).join('')}</ul></div>` : '';
      const meals = (o.plan?.meals || []).filter(m => m.cost != null);
      step = `<div class="card"><h2 style="margin-top:0">${c?.missing ? '⚠️ Panier introuvable' : c?.unavailable?.length ? '⚠️ Panier à vérifier' : '✅ C\'est prêt'}</h2>
        <p>Ton panier <b>${esc(b.store)}</b> est rempli sur <b>${app}</b> : <b>${eur(c?.total ?? b.total)}</b> frais inclus. Ouvre l'app pour vérifier et payer.</p>
        ${status}${repair}
        ${meals.length ? `<p class="small"><b>Payé :</b> ${eur((c?.total ?? b.total) / o.plan.meals.length)} par repas en moyenne.
          <b>Coût consommé par repas</b> (le reste va au placard) : ${meals.map(m => `${esc(m.when)} ≈ ${eur(m.cost)}`).join(' · ')}</p>` : ''}
        <div class="row">${o.hasPdf ? `<a class="btn" href="/api/orders/${esc(id)}/pdf" target="_blank">📄 Recettes + liste de courses (PDF)</a>` : ''}
          <button class="btn ghost" onclick="verify('${esc(id)}')">🔄 Revérifier le panier</button></div>
        <p class="muted small">Un article peut passer en rupture entre la préparation et le paiement : « Revérifier » relit le panier,
          fait remplacer les articles indisponibles par l'IA et met le PDF à jour. À faire juste avant de payer, ou si l'app affiche « article indisponible ».</p>
        <p class="muted small">Après les repas, note les plats dans <a href="#/plats">Mes plats</a>.</p></div>`;
    } else if (o.result) {
      step = `<div class="card"><h2 style="margin-top:0">Choisis ton panier</h2>
        ${o.result.recommendation ? `<p>💡 ${esc(o.result.recommendation)}</p>` : ''}
        <div class="table-wrap"><table class="cmp"><tr><th>Magasin</th><th class="num">Produits</th><th class="num">Total payé</th><th class="num" title="Total payé ÷ nombre de repas">€ / repas</th><th>Remarques</th><th></th></tr>
        ${[...o.result.baskets].sort((a, b) => a.total - b.total).map(b => `<tr class="${b.recommended ? 'reco' : ''}">
          <td><b>${esc(b.store)}</b><br><span class="muted small">${b.platform === 'ubereats' ? 'Uber Eats' : 'Deliveroo'}${b.eta ? ' · ' + esc(b.eta) : ''}</span>${b.recommended ? '<br><span class="badge ok">recommandé</span>' : ''}</td>
          <td class="num">${eur(b.subtotal)}</td><td class="num"><b>${eur(b.total)}</b></td><td class="num">≈ ${eur(perMeal(b, nMeals))}</td>
          <td class="small">${esc(b.notes || '')}${(b.fees || []).length ? `<br><span class="muted">${b.fees.map(f => esc(f.label + ' ' + f.amount)).join(' · ')}</span>` : ''}</td>
          <td><button class="btn" onclick="pick('${esc(id)}','${esc(b.id)}')">Je prends</button></td></tr>`).join('')}
        </table></div>
        <p class="muted small">« Je prends » garde ce panier dans l'app, vide les autres et génère le PDF des recettes.</p></div>`;
    } else if (o.menus && !o.choice?.chosen) {
      step = `<div class="card"><h2 style="margin-top:0">🍽 ${o.menus.options.length} menus t'attendent</h2>
        <p><a class="btn" href="/o/${esc(id)}/menus">Choisir mon menu</a></p></div>`;
    }
    const chosen = o.choice?.chosen;
    return `<p><a href="#/">← Commandes</a></p><h1>${esc(req.title || id)}</h1>
      <div class="card small"><b>Repas :</b> ${esc((req.slots || []).join(' · '))}<br>
        <b>Personnes :</b> ${esc(req.people)} ${req.extras ? `<br><b>Courses perso :</b> ${esc(req.extras)}` : ''}
        ${req.exceptions ? `<br><b>Exceptions :</b> ${esc(req.exceptions)}` : ''} ${req.wishes ? `<br><b>Envies :</b> ${esc(req.wishes)}` : ''}
        ${chosen ? `<br><b>Menu choisi :</b> ${esc(chosen.name)}${chosen.rejectedMeals?.length ? ` (sans : ${esc(chosen.rejectedMeals.join(', '))})` : ''}` : ''}</div>
      ${step}`;
  },

  // ---------- Mes plats ----------
  async '/plats'() {
    const { recipes, later } = await api('/recipes');
    return `<h1>Mes plats</h1>
      ${later.length ? `<h2>⏰ Menus gardés pour plus tard</h2>${later.map(m => `<div class="card small"><b>${esc(m.name)}</b> <span class="muted">(${esc(m.date)})</span><br>${esc(m.meals.map(x => x.title).join(' · '))}</div>`).join('')}` : ''}
      <h2>Recettes</h2>
      <div class="grid">${recipes.map(r => `<div class="card">
        <b>${esc(r.title)}</b> <span class="muted small">· ${r.time} min</span><br>
        <span class="small muted">${r.rating ? `★ ${r.rating}/5 · ` : ''}faite ${r.timesMade} fois${r.lastMade ? ` · dernière : ${esc(r.lastMade)}` : ''}</span>
        ${r.notes.length ? `<ul class="small">${r.notes.slice(-3).map(n => `<li>${esc(n)}</li>`).join('')}</ul>` : ''}
        <div class="stars" data-slug="${esc(r.slug)}" role="group" aria-label="Note">${[1, 2, 3, 4, 5].map(i => `<button type="button" data-v="${i}" aria-label="${i} étoile${i > 1 ? 's' : ''}">★</button>`).join('')}</div>
        <textarea placeholder="Remarque (ex. un peu fade, à refaire)" data-note="${esc(r.slug)}"></textarea>
        <div class="row" style="margin-top:8px"><button class="btn" onclick="rate('${esc(r.slug)}')">Enregistrer</button>
          <button class="btn ghost" onclick="made('${esc(r.slug)}')">Faite aujourd'hui</button></div>
      </div>`).join('')}</div>`;
  },

  // ---------- Profil ----------
  async '/profil'() {
    const { profile: p, exists } = await api('/profile');
    const EQUIP = ['plaques', 'four', 'micro-ondes', 'bouilloire', 'airfryer', 'mixeur', 'robot cuiseur', 'cocotte-minute'];
    const extra = (p.equipment || []).filter(e => !EQUIP.includes(e));
    setTimeout(() => $('#pf').onsubmit = async e => {
      e.preventDefault();
      const f = new FormData(e.target), list = k => String(f.get(k) || '').split(',').map(s => s.trim()).filter(Boolean);
      const equipment = [...f.getAll('eq'), ...list('eqOther')];
      try {
        await api('/profile', { method: 'PUT', body: {
          address: f.get('address'), people: Number(f.get('people')), equipment, noEquipment: EQUIP.filter(x => !equipment.includes(x)),
          allergies: list('allergies'), diet: list('diet'), pantry: list('pantry'), preferences: f.get('preferences'),
          subscriptions: { uberOne: f.has('uberOne'), deliverooPlus: f.has('deliverooPlus') },
        } });
        $('#pmsg').textContent = '✅ Profil enregistré'; $('#pmsg').className = '';
      } catch (err) { $('#pmsg').textContent = err.message; $('#pmsg').className = 'err'; }
    });
    return `<h1>Profil</h1>${exists ? '' : '<p class="muted">Profil pré-rempli avec un exemple : adapte-le puis enregistre.</p>'}
      <form id="pf" class="card">
        <label for="address">Adresse de livraison</label><input id="address" type="text" name="address" required value="${esc(p.address)}">
        <label for="ppl">Personnes par défaut</label><input id="ppl" type="number" name="people" min="1" max="20" value="${esc(p.people)}">
        <label>Équipements de cuisine</label>
        <div class="checks">${EQUIP.map(e => `<label><input type="checkbox" name="eq" value="${e}" ${(p.equipment || []).includes(e) ? 'checked' : ''}> ${e}</label>`).join('')}</div>
        <input type="text" name="eqOther" aria-label="Autres équipements" placeholder="Autres équipements (séparés par des virgules)" value="${esc(extra.join(', '))}" style="margin-top:8px">
        <label for="allergies">Allergies <span class="muted small">(séparées par des virgules)</span></label><input id="allergies" type="text" name="allergies" value="${esc((p.allergies || []).join(', '))}">
        <label for="diet">Régime <span class="muted small">(végétarien, sans porc…)</span></label><input id="diet" type="text" name="diet" value="${esc((p.diet || []).join(', '))}">
        <label for="pantry">Toujours dans le placard <span class="muted small">(jamais acheté)</span></label><input id="pantry" type="text" name="pantry" value="${esc((p.pantry || []).join(', '))}">
        <label for="prefs">Préférences</label><textarea id="prefs" name="preferences">${esc(p.preferences)}</textarea>
        <label>Abonnements</label>
        <div class="checks"><label><input type="checkbox" name="uberOne" ${p.subscriptions?.uberOne ? 'checked' : ''}> Uber One</label><label><input type="checkbox" name="deliverooPlus" ${p.subscriptions?.deliverooPlus ? 'checked' : ''}> Deliveroo Plus</label></div>
        <p id="pmsg"></p><button class="btn">Enregistrer</button>
      </form>`;
  },

  // ---------- Comptes ----------
  async '/comptes'() {
    const [a, jobs] = await Promise.all([api('/accounts'), api('/jobs')]);
    const active = jobs.filter(j => !j.orderId && ['queued', 'running'].includes(j.status));
    if (active.length) poll(render);
    const card = (p, name) => `<div class="card"><b>${name}</b> <span class="badge ${a[p] ? 'ok' : ''}">${a[p] ? 'session enregistrée' : 'jamais connecté'}</span>
      <p class="small muted">Une fenêtre Chrome s'ouvre sur ton Mac : connecte-toi, puis ferme la fenêtre.</p>
      <div class="row"><button class="btn" onclick="account('${p}','login')">Se connecter</button>
      <button class="btn ghost" onclick="if(confirm('Vider TOUS tes paniers ${name} ?')) account('${p}','clear')">Vider tous mes paniers</button></div></div>`;
    return `<h1>Comptes</h1><div class="grid">${card('ubereats', 'Uber Eats')}${card('deliveroo', 'Deliveroo')}</div>
      ${active.map(j => `<div class="card"><span class="spin"></span> ${esc(j.label)} — ${esc(j.status === 'queued' ? 'en attente' : 'en cours')}<div class="log">${esc(j.log.join('\n'))}</div></div>`).join('')}
      <p class="muted small">Connexion nécessaire pour voir tes vrais frais (Uber One, Deliveroo Plus). Si les frais semblent faux, reconnecte-toi.</p>`;
  },
};

async function rebuild(id) {
  if (!confirm('Recréer le panier dans l\'app ? Ne le fais pas si tu as déjà passé la commande (tu aurais un panier en double).')) return;
  try { await api(`/orders/${id}/verify`, { method: 'POST', body: { rebuild: true } }); render(); } catch (e) { alert(e.message); }
}
async function verify(id) { try { await api(`/orders/${id}/verify`, { method: 'POST' }); render(); } catch (e) { alert(e.message); } }
async function retry(id) { try { await api(`/orders/${id}/retry`, { method: 'POST' }); render(); } catch (e) { alert(e.message); } }
async function pick(id, basketId) { if (!confirm('Garder ce panier et vider les autres ?')) return; try { await api(`/orders/${id}/pick`, { method: 'POST', body: { basketId } }); render(); } catch (e) { alert(e.message); } }
async function account(p, action) { try { await api(`/accounts/${p}/${action}`, { method: 'POST' }); render(); } catch (e) { alert(e.message); } }
async function made(slug) { await api('/recipes/' + slug, { method: 'POST', body: { action: 'made' } }); render(); }
async function rate(slug) {
  const score = document.querySelectorAll(`.stars[data-slug="${slug}"] .on`).length;
  const note = document.querySelector(`[data-note="${slug}"]`).value.trim();
  try {
    if (score) await api('/recipes/' + slug, { method: 'POST', body: { action: 'rate', score, note } });
    else if (note) await api('/recipes/' + slug, { method: 'POST', body: { action: 'note', note } });
    else return alert('Choisis une note ou écris une remarque');
    render();
  } catch (e) { alert(e.message); }
}
document.addEventListener('click', e => {
  const b = e.target.closest('.stars button');
  if (b) b.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', +x.dataset.v <= +b.dataset.v));
});

async function render() {
  clearTimeout(timer);
  const h = location.hash.slice(1) || '/';
  const [, base, arg] = h.match(/^(\/o)\/([\w-]+)$/) || [, h];
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + h));
  const view = arg ? views['/o/:id'] : views[base];
  try { $('#app').innerHTML = view ? await view(arg) : '<p>Page introuvable.</p>'; }
  catch (e) { $('#app').innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}
addEventListener('hashchange', render);
render();
</script>
